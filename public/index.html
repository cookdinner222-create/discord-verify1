<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>디스코드 서버 인증 및 역할 선택</title>
    <style>
        body { background-color: #313338; color: #fff; font-family: sans-serif; text-align: center; margin-top: 80px; }
        .card { background: #2b2d31; padding: 35px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 360px; text-align: left; }
        h2 { text-align: center; color: #fff; margin-bottom: 10px; }
        p { color: #b5bac1; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .roles-box { background: #1e1f22; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .roles-box label { display: block; margin-bottom: 12px; cursor: pointer; font-size: 15px; }
        .btn { background: #5865F2; color: white; padding: 12px; text-decoration: none; border-radius: 5px; font-weight: bold; display: block; text-align: center; border: none; width: 100%; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #4752C4; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 서버 보안 인증</h2>
        <p>인증과 함께 받을 역할을 선택해주세요.</p>
        
        <form action="/verify" method="GET">
            <div class="roles-box">
                <label><input type="checkbox" checked disabled> ✅ 기본 인증 멤버 (필수)</label>
                <label><input type="checkbox" name="roles" value="1541423418753155135"> 📢 공지 알림 받기</label>
            </div>
            <button type="submit" class="btn">디스코드 로그인하고 인증하기</button>
        </form>
    </div>
</body>
</html>
